name: Build Satella Rootless
on:
  push:
    branches: [ emt, main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Setup & Build
      run: |
        brew install ldid xz
        git clone --recursive https://github.com $GITHUB_WORKSPACE/theos
        git clone --depth=1 https://github.com $GITHUB_WORKSPACE/theos/sdks
        export THEOS=$GITHUB_WORKSPACE/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:14.0
    - uses: actions/upload-artifact@v4
      with:
        name: Satella-Arabic-Rootless
        path: packages/*.deb
