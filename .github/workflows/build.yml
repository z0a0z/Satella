name: Build Satella Rootless

on:
  push:
    branches: [ emt, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Homebrew Dependencies
      run: |
        brew install ldid xz

    - name: Setup Theos System
      run: |
        export THEOS_DIR=$GITHUB_WORKSPACE/theos
        rm -rf $THEOS_DIR
        
        # تحميل الأداة والـ SDKs بشكل رسمي ومباشر
        bash -c "$(curl -fsSL https://githubusercontent.com)"
        git clone --depth=1 https://github.com $THEOS_DIR/sdks

    - name: Compile Package
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satella-Arabic-Rootless
        path: packages/*.deb
