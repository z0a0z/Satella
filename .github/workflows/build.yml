name: Build Satella Rootless

on:
  push:
    branches: [ emt, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Clean and Install Theos and SDKs
      run: |
        rm -rf theos
        git clone --recursive https://github.com theos
        git clone --depth=1 https://github.com theos/sdks

    - name: Compile Package
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satella-Arabic-Rootless
        path: packages/*.deb
