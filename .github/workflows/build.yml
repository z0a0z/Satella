name: Build Satella Rootless

on:
  push:
    branches: [ emt, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Theos and SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
        git clone --depth=1 https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

    - name: Compile Package
      env:
        THEOS: ${{ github.workspace }}/theos
        THEOS_PACKAGE_SCHEME: rootless
      run: |
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satella-Arabic-Rootless
        path: packages/*.deb
