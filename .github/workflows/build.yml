name: Build Satella Rootless

on:
  push:
    branches: [ emt, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Theos System
      run: |
        brew install ldid xz
        git clone --recursive "https://github.com" $HOME/theos
        git clone --depth=1 "https://github.com" $HOME/theos/sdks

    - name: Compile Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:14.0
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satella-Arabic-Rootless
        path: packages/*.deb
